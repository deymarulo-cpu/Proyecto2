<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juguemos un juego Mi Amor 💖</title>
  <link rel="icon" href="corazon.png" type="image/png">

  <!-- Fuente retro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Fondo estrellas -->
  <div class="stars"></div>
  
<!-- FLORES DE LOTO -->
<div class="lotos">
  <img src="https://tuusuario.github.io/tu-repo/loto.png" class="loto loto-izq oculto">
  <img src="https://tuusuario.github.io/tu-repo/loto.png" class="loto loto-der1 oculto">
  <img src="https://tuusuario.github.io/tu-repo/loto.png" class="loto loto-der2 oculto">

  <!-- Transición pixel -->
  <div class="pixel-transition"></div>

  <!-- Pantalla Inicio -->
  <div class="inicio" id="inicio">
    <div class="cuadro-start">
      <h1>✨ COMENZAMOS LEYLEY? ✨</h1>
      <button onclick="iniciarTodo()">START</button>
    </div>
  </div>

  <!-- Contenido Principal -->
  <div class="pantalla" id="pantallaPrincipal">
    <h2>🌌 Bienvenida al juego 💖</h2>
  </div>

  <script src="script.js"></script>

</html>
