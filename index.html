<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Juguemos un juego Mi Amor 💖</title>
  <link rel="icon" href="corazon.png" type="image/png">

  <!-- Fuente estilo retro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <!-- Hoja de estilos -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
<div class="pixel-transition"></div>

<!-- PÁGINA DE INICIO -->
<div class="inicio" id="inicio">
  <div class="cuadro-start">
    <h1>✨ COMENZAMOS LEYLEY? ✨</h1>
    <button onclick="iniciarTodo()">START</button>
  </div>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div class="pantalla" id="pantallaInicio">
  <div class="agua"></div>

  <div class="flor-container">
    <div class="flor" onclick="abrirFlor()"></div>
    <p class="texto-inicio">
      Hay algo que ha estado floreciendo en mi corazón…
    </p>
    <p class="instruccion">
      🌸 Haz clic en el primer pétalo para comenzar.
    </p>
  </div>
</div>

<div class="pantalla oculto" id="nota1">
  <div class="carta">
    <h2>Todo comenzó sin que me diera cuenta…</h2>
    <p>
      Fue algo pequeño… una conversación,
      una sonrisa,
      un momento que empezó a quedarse.
    </p>

    <button onclick="mostrarNota2()">🌸 Descubre lo que sentí después</button>
  </div>
</div>

<div class="pantalla oculto" id="nota2">
  <h2>¿Sabes qué pasa cuando sonríes?</h2>

  <button onclick="respuesta()">💓 Mi mundo se detiene</button>
  <button onclick="respuesta()">🌞 Todo se ilumina</button>
  <button onclick="respuesta()">😳 Me pongo nervioso</button>

  <p id="respuestaTexto"></p>
</div>
  
<!-- Enlazamos el JS al final del body -->
<script src="script.js"></script>
</body>
</html>
