<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Juguemos un juego Mi Amor 💖</title>
  <link rel="icon" href="corazon.png" type="image/png">

  <!-- Fuente estilo retro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <!-- Hoja de estilos -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
<div class="pixel-transition"></div>

<!-- PÁGINA DE INICIO -->
<div class="inicio" id="inicio">
  <div class="cuadro-start">
    <h1>✨ COMENZAMOS LEYLEY? ✨</h1>
    <button onclick="startGame(); mostrarPagina();">START</button>
  </div>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div class="container" id="contenido" style="display:none;">
  <h1>Para ti 💖</h1>

  <!-- Cartas -->
  <div class="carta">
    <h2>Para ti 💖</h2>
    <p>Espero que tengas un día lleno de amor y felicidad 😍</p>
  </div>

  <div class="carta">
    <h2>Mi otro mensaje 💌</h2>
    <p>Gracias por hacerme sonreír cada día 😘</p>
  </div>

  <button class="yes" onclick="aceptar()">Sí 💕</button>
  <button class="no" onmouseover="mover()">No 😢</button>
</div>

<!-- Enlazamos el JS al final del body -->
<script src="script.js"></script>
</body>
</html>
